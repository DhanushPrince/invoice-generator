# SonarCloud configuration (see "SonarCloud setup" in README.md).
sonar.organization=dhanushprince
sonar.projectKey=DhanushPrince_invoice-generator
sonar.projectName=Invoice Template Filler

sonar.sources=extension,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.mjs,tests/**/*.js
sonar.exclusions=node_modules/**,dist/**,verify/**,tests/out/**,tests/fixtures/**,extension/vendor/**,**/*.min.js
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Browser-only code (DOM / chrome.* APIs) is covered by the Playwright e2e suite,
# which does not emit lcov; vendored libs and build scripts are excluded too.
sonar.coverage.exclusions=extension/vendor/**,scripts/**,tests/**
